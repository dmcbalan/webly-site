<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сторінку не знайдено — Webly</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:2rem;background:#0A0A0C;color:#F2F0EA;font-family:"Inter Tight",system-ui,sans-serif;text-align:center;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:44px 44px}
.c{display:grid;justify-items:center;gap:1.2rem}
.n{font:800 clamp(6rem,24vw,12rem)/1 "Inter Tight",sans-serif;letter-spacing:-.06em;background:linear-gradient(100deg,#C6FF34,#FFD23A 50%,#FF6B2C);-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin:0;color:#9A9AA6;font:500 .9rem/1.6 "JetBrains Mono",monospace}
a{display:inline-flex;gap:.5rem;align-items:center;padding:.9rem 1.5rem;border-radius:999px;background:#C6FF34;color:#0A0A0C;font-weight:700;text-decoration:none;transition:transform .3s}
a:hover{transform:translateY(-2px)}
</style>
</head>
<body>
<div class="c">
  <div class="n">404</div>
  <p>// такої сторінки немає — але сайт під ключ є</p>
  <a href="/">← На головну Webly</a>
</div>
</body>
</html>
